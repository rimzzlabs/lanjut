name: CI

on:
  pull_request:

permissions:
  contents: read

# release-please force-pushes its branch, which leaves the runs from the
# previous push building a commit that no longer exists. Those runs report a
# failure with no jobs in it. Drop them when a newer push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm validate:exports

  build:
    # The static build and the Worker bundle take seconds, so every PR proves
    # both before a release deploys them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The landing page lists the contributors at build time. The token keeps
      # that request clear of the anonymous rate limit that runners share.
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm --filter @lanjut/web exec wrangler deploy --dry-run --outdir .wrangler/dry-run
