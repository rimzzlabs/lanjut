name: Bug report
description: Something in Lanjut is broken or behaves unexpectedly.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Lanjut is local-first: your résumé lives only in your browser, so the details below are all we have to go on. The in-app form ("Send feedback" in the sidebar) asks the same questions and fills in the technical details for you.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where in Lanjut does it happen?
      options:
        - Editor
        - Preview
        - PDF download
        - Word download
        - Text, JSON, or YAML download
        - Import
        - Templates
        - Library and profiles
        - Mac app
        - Home page
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What I did
      description: The steps, one per line, so we can do the same.
      placeholder: |
        1. Opened a résumé made with Luasa
        2. Added my city
        3. Downloaded it as a PDF
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What I expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Copy any error message exactly. Screenshots help a lot.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Happens
      options:
        - Every time
        - Sometimes
        - Only once
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App, browser, and system
      description: The version is at the bottom of the sidebar. Storage is per browser, so this matters.
      placeholder: e.g. Lanjut 0.19.0, Chrome 138 on macOS 15
    validations:
      required: true
