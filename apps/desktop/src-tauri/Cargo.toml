[package]
name = "lanjut"
version = "0.0.0"
description = "Free, local-first ATS resume builder"
authors = ["Rizki Citra"]
edition = "2021"
rust-version = "1.88"

[workspace]
members = [".", "relay"]

[lib]
name = "lanjut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lanjut-mcp = { path = "relay" }
rmcp = { version = "3.11", default-features = false, features = ["macros", "server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["io-util", "net", "time", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
