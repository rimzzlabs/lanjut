name: Feature request
description: Suggest an improvement or a new capability for Lanjut.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A note on scope: every résumé stays one readable column so applicant tracking systems parse it cleanly. Tables, columns, and text boxes are out of scope; looks, spacing, fonts, and section order are fair game. Accounts and server-side storage are also non-goals.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor
        - Preview
        - PDF download
        - Word download
        - Text, JSON, or YAML download
        - Import
        - Templates
        - Library and profiles
        - Mac app
        - Home page
        - Other
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What I am trying to do
      description: The situation, not only the solution. It helps us find the best fix.
      placeholder: I apply for jobs in two countries and keep a version of my résumé for each.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How I manage today
  - type: dropdown
    id: impact
    attributes:
      label: How much it would help
      options:
        - Nice to have
        - Saves time
        - Cannot use Lanjut without it
    validations:
      required: true
