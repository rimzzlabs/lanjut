packages:
  - apps/*
  - packages/*

# One version for each dependency more than one workspace uses. A workspace
# asks for it with "catalog:", so the versions cannot drift apart.
catalog:
  "@base-ui/react": ^1.6.0
  "@mobily/ts-belt": 4.0.0-rc.5
  "@phosphor-icons/react": ^2.1.10
  "@tiptap/core": ^3.27.1
  "@types/react": ^19
  "@types/react-dom": ^19
  "nanoid": ^5.1.16
  "next-themes": ^0.4.6
  "react": 19.2.4
  "react-dom": 19.2.4
  "sonner": ^2.0.7
  "typescript": ^5
  "unpdf": ^1.6.2
  "use-intl": ^4.14.9
  "zod": ^4.4.3

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - esbuild
  - workerd

patchedDependencies:
  nextstepjs@2.2.0: patches/nextstepjs@2.2.0.patch

# nextstepjs and nuqs list next as an optional peer. Lanjut does not use it.
overrides:
  next: "-"
