name: Release

on:
  push:
    branches: [main]
  # Lets the desktop app be built and attached to a tag that already exists,
  # so a failed upload can be repaired without inventing a release.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach the desktop app to
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

# A release must never be cancelled halfway, so runs queue instead. Two merges
# in quick succession otherwise tag and upload at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm validate:exports

      # Public Turnstile site key, inlined at build time. The token lets the
      # landing page list the contributors past the anonymous rate limit.
      - run: pnpm build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy ${{ needs.release-please.outputs.tag_name }} to Cloudflare Workers
        run: pnpm --filter @lanjut/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  desktop:
    # Attaches the desktop app to the release, one build per system and
    # architecture rather than a universal binary, so nobody downloads twice the
    # bytes they need.
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
          # Built on the oldest Ubuntu the app supports: a Linux build runs only
          # on a glibc as new as the one it was built against, or newer.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install the Linux webview and bundling libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2

      - run: pnpm install --frozen-lockfile

      # The same guard the Desktop workflow runs. A release builds from a tag, and
      # nothing else on this path reads the config before the bundle is built.
      - name: Confirm the shell config still holds its load-bearing values
        run: node .github/scripts/check-tauri-config.mjs

      # Resolved here rather than taken from the release-please output, so the
      # manual path and the release path reach the action the same way.
      - id: release
        run: echo "id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: tauri-apps/tauri-action@v0
        env:
          # The action uploads the bundle to the release, so it needs a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundle. Without these the updater has nothing to
          # verify against and the build produces no update manifest.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LANJUT_TARGET: desktop
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        with:
          releaseId: ${{ steps.release.outputs.id }}
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}

  publish:
    # release-please cuts every release as a draft. It stays hidden until every
    # system and architecture has uploaded a signed bundle, so a failed build
    # never leaves a public release with no app, and releases/latest never moves
    # to one.
    needs: [release-please, desktop]
    if: >-
      !cancelled() &&
      needs.desktop.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # tauri-action warns and carries on when it builds no updater artifact or
      # finds no signature, so the only proof is the manifest on the release.
      # Keep this list in step with the desktop matrix. On Linux the plain key
      # serves the AppImage, and an app installed from a .deb or an .rpm reads
      # its own key.
      - name: Confirm the release carries a signed update manifest
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern latest.json --output latest.json --clobber
          node .github/scripts/check-update-manifest.mjs
        env:
          PLATFORMS: >-
            darwin-aarch64 darwin-x86_64
            windows-x86_64 windows-aarch64
            linux-x86_64 linux-x86_64-deb linux-x86_64-rpm
            linux-aarch64 linux-aarch64-deb linux-aarch64-rpm

      # The download button on lanjut.org opens the latest release, so each
      # release page carries the install steps, one heading level down and with
      # the real file names. A rerun finds the heading and changes nothing.
      - name: Add the install steps to the release notes
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body > notes.md
          if ! grep -q '^## Install Lanjut' notes.md; then
            printf '\n\n' >> notes.md
            sed -E -e 's/^(#+) /\1# /' -e "s/<version>/${TAG#v}/g" docs/install.md >> notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi

      # make_latest=legacy lets GitHub pick the latest release by date and
      # version. The API defaults to true, which would let a repair of an older
      # tag pull releases/latest, and every installed updater, backwards.
      - name: Publish ${{ env.TAG }}
        run: |
          set -euo pipefail
          id=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F draft=false -f make_latest=legacy --jq '"published \(.tag_name), draft=\(.draft)"'
